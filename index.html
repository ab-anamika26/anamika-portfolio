<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <title>Anamika | Portfolio</title>

    <style>
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: linear-gradient(to right, #f5f7fa, #e6ecf5);
        color: #333;
      }

      
      header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: #0a192f;
        padding: 18px 10%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        color: #64ffda;
        font-size: 26px;
        text-decoration: none;
        font-weight: bold;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-size: 16px;
        position: relative;
      }

      nav a::after {
        content: "";
        width: 0;
        height: 2px;
        background: #64ffda;
        position: absolute;
        left: 0;
        bottom: -5px;
        transition: 0.3s;
      }

      nav a:hover::after {
        width: 100%;
      }

      
      .home {
        min-height: 90vh;
        padding: 60px 10%;
        display: flex;
        align-items: center;
        gap: 60px;
      }

      .home-img img {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        /* box-shadow: 0 0 40px rgba(100, 255, 218, 0.6); */
        /* animation:" float 3s ease-in-out infinite;" */
      }

      @keyframes float {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
        100% {
          transform: translateY(0);
        }
      }

      .home-content h1 {
        font-size: 40px;
        margin-bottom: 10px;
      }

      .home-content h1 span {
        color: #0a192f;
      }

      .home-content h3 {
        font-size: 24px;
        margin-bottom: 15px;
        color: #555;
      }

      .home-content p {
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 25px;
      }

      /* ================= SOCIAL ================= */
      .social-icons a {
        font-size: 22px;
        margin-right: 18px;
        color: #0a192f;
        transition: 0.3s;
      }

      .social-icons a:hover {
        color: #64ffda;
        transform: translateY(-4px);
      }

      /* ================= BUTTON ================= */
      .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 30px;
        background: linear-gradient(45deg, #0a192f, #112240);
        color: white;
        text-decoration: none;
        border-radius: 30px;
        transition: 0.3s;
      }

      .btn:hover {
        background: #64ffda;
        color: #0a192f;
      }

      /* ================= RESPONSIVE ================= */
      @media (max-width: 768px) {
        .home {
          flex-direction: column;
          text-align: center;
        }

        nav a {
          margin-left: 15px;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <a href="#home" class="logo">Anamika</a>
      <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="achievments.html">achievments</a>
   
        <a href="contact.html">Contact</a>
          </nav> 
    </header>

    <!-- HOME -->
     
    <section class="home" id="home">
      <div class="home-img">
        <img src="p.jpeg" alt="Anamika" />
      </div>
      <section class="about" id="about">
       

      <div class="home-content">
        <h1>Hi, I'm <span>Anamika</span></h1>
        <h3>Aspire Full Stack Developer</h3>
        <p>
          Engineering student passionate about web development. Aspiring full
          stack developer who loves building clean and responsive web
          experiences.
        </p>

        <div class="social-icons">
          <a href="https://github.com/ab-anamika26/vidya"><i class="fa fa-github"></i></a>
          <a href="abanamika26@gmail.com"><i class="fa fa-envelope"></i></a>
          <a href="https://www.linkedin.com/in/anamikaab/"><i class="fa fa-linkedin"></i></a>
          <a href="https://www.instagram.com/anamikabalan__/"><i class="fa fa-instagram"></i></a>
          <a href="resume.pdf" download >Download Resume</a>
        </div>

        <!-- <a href="#" class="btn">Hire Me</a> -->
      </div>
    </section>
  </body>
</html>
